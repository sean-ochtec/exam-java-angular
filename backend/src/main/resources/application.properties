spring.application.name=notices

# In-memory H2 database, seeded from data.sql on startup
spring.datasource.url=jdbc:h2:mem:notices
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Browse the database at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:notices, user: sa, no password)
spring.h2.console.enabled=true
